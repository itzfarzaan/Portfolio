    <meta name="theme-color" content="#fafaf8" />
    <script>
      // Apply the saved theme (or the OS preference) before first paint, so dark mode never flashes light.
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e0f13');
      })();
    </script>
