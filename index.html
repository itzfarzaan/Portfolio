    <meta name="theme-color" content="#fafaf8" />
    <script>
      // Apply the visitor's saved theme before first paint. Everyone starts in light mode, whatever the OS setting.
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'dark') theme = 'light';
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e0f13');
      })();
    </script>
